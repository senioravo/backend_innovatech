apiVersion: apps/v1
kind: Deployment
metadata:
  name: kpi
  labels:
    app.kubernetes.io/name: ms-kpi
    app.kubernetes.io/part-of: innovatech
    app.kubernetes.io/component: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kpi
  template:
    metadata:
      labels:
        app: kpi
        app.kubernetes.io/name: ms-kpi
        app.kubernetes.io/part-of: innovatech
        app.kubernetes.io/component: microservice
    spec:
      containers:
        - name: kpi
          image: kpi:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
          envFrom:
            - configMapRef:
                name: ms-kpi-config
          volumeMounts:
            - name: jwt-public-key
              mountPath: /app/keys/public.key
              subPath: public.key
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: jwt-public-key
          secret:
            secretName: auth-jwt-keys
            items:
              - key: public.key
                path: public.key
