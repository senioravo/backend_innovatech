# Stack local: API Gateway (KrakenD) → BFF → auth | project-manager
# Uso:
#   1. Genera claves RSA: cd ms-auth && node scripts/generate-keys.js
#   2. Copia public.key al BFF: cp ms-auth/keys/public.key bff/keys/public.key
#   3. Copia .env.docker.example a .env.docker y rellena DATABASE_URL
#   4. docker compose --env-file .env.docker up --build
# Entrada HTTP: http://localhost:8010/api/v1/…
# 
# SEGURIDAD JWT (RS256) con KrakenD:
#   - KrakenD: valida JWT con clave PÚBLICA (desde ms-auth/.well-known/jwks.json)
#   - ms-auth: usa clave PRIVADA para FIRMAR tokens
#   - BFF: confía en headers X-User-* que KrakenD ya validó (NO valida tokens)

services:
  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: innovatech_users
    ports:
      - "5433:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data
      - ./ms-users/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./ms-users/database/seed-users.sql:/docker-entrypoint-initdb.d/02-seed-users.sql:ro

  pm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: innovatech_pm
    ports:
      - "5434:5432"
    volumes:
      - pm_db_data:/var/lib/postgresql/data
      - ./ms-project-manager/db/migrations/001_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./ms-project-manager/db/migrations/002_task_status.sql:/docker-entrypoint-initdb.d/02-task-status.sql:ro
      - ./ms-project-manager/db/migrations/003_project_status.sql:/docker-entrypoint-initdb.d/03-project-status.sql:ro

  api-gateway:
    image: devopsfaith/krakend:2.7
    ports:
      - "8010:8080"
    volumes:
      - ./api-gateway/krakend.json:/etc/krakend/krakend.json:ro
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    depends_on:
      - bff
      - auth

  bff:
    build:
      context: ./bff
    environment:
      PORT: "3010"
      API_GATEWAY_PREFIX: /api/v1
      JWT_ISSUER: innovatech-auth
      # Ya NO valida JWT - confía en headers de KrakenD (X-User-*)
      AUTH_SERVICE_BASE_URL: http://auth:3001
      AUTH_API_PREFIX: /api/auth
      PROJECT_MANAGER_BASE_URL: http://project-manager:3002
      PROJECT_MANAGER_API_PREFIX: /api/v1
    volumes:
      - ./ms-auth/keys/public.key:/app/keys/public.key:ro
    expose:
      - "3010"
    depends_on:
      - auth
      - project-manager

  auth:
    build:
      context: ./ms-auth
    environment:
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL_AUTH:-}
      # Ya NO necesita JWT_SECRET - usa clave privada RSA
      JWT_EXPIRES_IN: "1h"
      JWT_ISSUER: "innovatech-auth"
      # URL del microservicio de usuarios para consultar datos durante login
      USERS_SERVICE_URL: ${USERS_SERVICE_URL:-http://users:3003}
      # Token de seguridad para comunicación interna entre servicios
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-development-token}
    volumes:
      # Clave PRIVADA RSA para firmar tokens (solo lectura)
      - ./ms-auth/keys/private.key:/app/keys/private.key:ro
      # Clave PÚBLICA RSA (opcional, para verificación local)
      - ./ms-auth/keys/public.key:/app/keys/public.key:ro
    expose:
      - "3001"
    depends_on:
      - users

  project-manager:
    build:
      context: ./ms-project-manager
    environment:
      PORT: "3002"
      DATABASE_URL: postgresql://postgres:postgres@pm-db:5432/innovatech_pm?sslmode=disable
      # Ya NO necesita JWT_SECRET - usa clave pública RSA
      API_GATEWAY_PREFIX: /api/v1
    volumes:
      # Clave PÚBLICA RSA para verificar tokens (solo lectura)
      - ./ms-auth/keys/public.key:/app/keys/public.key:ro
    expose:
      - "3002"
    depends_on:
      - pm-db

  users:
    build:
      context: ./ms-users
    environment:
      PORT: "3003"
      # Docker local: Postgres del servicio users-db (ignora Neon del .env.docker)
      DATABASE_URL: postgresql://postgres:postgres@users-db:5432/innovatech_users?sslmode=disable
      # Verifica tokens JWT con clave pública RSA
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      JWT_ISSUER: "innovatech-auth"
      LOG_LEVEL: "info"
      # Token de seguridad para validar llamadas internas de otros servicios
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-development-token}
    volumes:
      # Clave PÚBLICA RSA para verificar tokens (solo lectura)
      - ./ms-auth/keys/public.key:/app/keys/jwt_public.pem:ro
    expose:
      - "3003"
    depends_on:
      - users-db

volumes:
  users_db_data:
  pm_db_data:
