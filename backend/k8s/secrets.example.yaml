# Plantilla de secretos — NO aplicar con valores reales en el repositorio.
# Copia, rellena y aplica manualmente:
#   kubectl apply -f k8s/secrets.yaml -n innovatech
#
# Claves JWT (crear aparte desde ms-auth/keys/):
#   kubectl create secret generic innovatech-jwt-keys -n innovatech \
#     --from-file=private.key=ms-auth/keys/private.key \
#     --from-file=public.key=ms-auth/keys/public.key
---
apiVersion: v1
kind: Secret
metadata:
  name: innovatech-secrets
  namespace: innovatech
  labels:
    app.kubernetes.io/part-of: innovatech
type: Opaque
stringData:
  # Opción A — todo en Kubernetes (ver k8s/postgres/):
  # DATABASE_URL_USERS: "postgresql://postgres:POSTGRES_PASSWORD@users-db:5432/innovatech_users?sslmode=disable"
  # DATABASE_URL_PM: "postgresql://postgres:POSTGRES_PASSWORD@pm-db:5432/innovatech_pm?sslmode=disable"
  # DATABASE_URL_AUTH: "postgresql://postgres:POSTGRES_PASSWORD@users-db:5432/innovatech_users?sslmode=disable"
  # Opción B — BD externa (Neon, RDS, etc.):
  DATABASE_URL_AUTH: "postgresql://USER:PASSWORD@HOST:5432/authdb?sslmode=require"
  DATABASE_URL_USERS: "postgresql://USER:PASSWORD@HOST:5432/usersdb?sslmode=require"
  DATABASE_URL_PM: "postgresql://USER:PASSWORD@HOST:5432/pmdb?sslmode=require"
  INTERNAL_SERVICE_TOKEN: "change-me-in-production"
  # GlitchTip — DSN real en secrets.local.yaml (ver backend/GLITCHTIP.md)
  SENTRY_DSN: "https://<public-key>@app.glitchtip.com/<project-id>"
---
apiVersion: v1
kind: Secret
metadata:
  name: innovatech-db-secrets
  namespace: innovatech
  labels:
    app.kubernetes.io/part-of: innovatech
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me-in-production"
