apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pm-db-data
  labels:
    app.kubernetes.io/name: pm-db
    app.kubernetes.io/part-of: innovatech
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm-db
  labels:
    app.kubernetes.io/name: pm-db
    app.kubernetes.io/part-of: innovatech
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pm-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pm-db
        app.kubernetes.io/part-of: innovatech
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: innovatech_pm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: innovatech-db-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - innovatech_pm
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - innovatech_pm
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pm-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: pm-db
  labels:
    app.kubernetes.io/name: pm-db
    app.kubernetes.io/part-of: innovatech
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pm-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
