apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: innovatech
    app.kubernetes.io/component: bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff
        app.kubernetes.io/part-of: innovatech
        app.kubernetes.io/component: bff
    spec:
      containers:
        - name: bff
          image: innovatech/bff:1.0.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3010
          envFrom:
            - configMapRef:
                name: bff-config
          volumeMounts:
            - name: jwt-public-key
              mountPath: /app/keys/public.key
              subPath: public.key
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: jwt-public-key
          secret:
            secretName: innovatech-jwt-keys
            items:
              - key: public.key
                path: public.key
