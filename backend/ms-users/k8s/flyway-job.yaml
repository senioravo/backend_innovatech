apiVersion: batch/v1
kind: Job
metadata:
  name: ms-users-flyway
  namespace: innovatech
  labels:
    app.kubernetes.io/name: ms-users
    app.kubernetes.io/component: migration
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: flyway
          image: flyway/flyway:10
          args:
            - -url=jdbc:postgresql://users-db:5432/innovatech_users
            - -user=postgres
            - -password=$(POSTGRES_PASSWORD)
            - -connectRetries=10
            - -baselineOnMigrate=true
            - migrate
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: innovatech-db-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: flyway-sql
              mountPath: /flyway/sql
              readOnly: true
      volumes:
        - name: flyway-sql
          configMap:
            name: ms-users-flyway-sql
