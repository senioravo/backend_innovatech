apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-auth
  labels:
    app.kubernetes.io/name: ms-auth
    app.kubernetes.io/part-of: innovatech
    app.kubernetes.io/component: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-auth
        app.kubernetes.io/part-of: innovatech
        app.kubernetes.io/component: microservice
    spec:
      containers:
        - name: ms-auth
          image: innovatech/ms-auth:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: ms-auth-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: innovatech-secrets
                  key: DATABASE_URL_AUTH
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: innovatech-secrets
                  key: INTERNAL_SERVICE_TOKEN
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/auth/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/auth/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: jwt-keys
          secret:
            secretName: innovatech-jwt-keys
