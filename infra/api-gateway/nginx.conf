worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  upstream bff_upstream {
    server bff:3010;
  }

  server {
    listen 8080;
    server_name _;

    # Salud del propio gateway (no pasa por el BFF)
    location = /gateway-health {
      default_type text/plain;
      return 200 'API Gateway OK\n';
    }

    # BFF health (microservicio BFF)
    location = /health {
      proxy_pass http://bff_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo el API agregado del BFF (auth + project-manager vía orquestación)
    location /api/v1/ {
      proxy_pass http://bff_upstream/api/v1/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_read_timeout 60s;
    }

    location / {
      default_type application/json;
      return 404 '{"error":"Not found. Use /api/v1/… or /health"}';
    }
  }
}
