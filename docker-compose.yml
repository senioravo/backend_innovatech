# Stack local: API Gateway (nginx) → BFF → auth | project-manager
# Uso:
#   1. Copia .env.docker.example a .env.docker y rellena variables (p. ej. DATABASE_URL).
#   2. docker compose --env-file .env.docker up --build
# Entrada HTTP: http://localhost:8080/api/v1/…

services:
  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./infra/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bff

  bff:
    build:
      context: ./services/bff
    environment:
      PORT: "3010"
      API_GATEWAY_PREFIX: /api/v1
      AUTH_SERVICE_BASE_URL: http://auth:3001
      AUTH_API_PREFIX: /api/auth
      PROJECT_MANAGER_BASE_URL: http://project-manager:3002
      PROJECT_MANAGER_API_PREFIX: /api/v1
    expose:
      - "3010"
    depends_on:
      - auth
      - project-manager

  auth:
    build:
      context: ./auth
    environment:
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL_AUTH:-}
      JWT_SECRET: ${JWT_SECRET:-changeme}
    expose:
      - "3001"

  project-manager:
    build:
      context: ./services/project-manager
    environment:
      PORT: "3002"
      DATABASE_URL: ${DATABASE_URL_PM:-}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      API_GATEWAY_PREFIX: /api/v1
    expose:
      - "3002"
